[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmissionqtremote"
version = "0.2.0"
description = "A graphical user interface for interacting with Transmission torrent servers"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Nasef Khan", email = "nakhan98@gmail.com"},
]
keywords = ["transmission", "torrent", "gui", "qt", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: Desktop Environment",
]
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.25.0",
    "python-dotenv>=0.19.0",
    "qdarkstyle>=3.0.0",
    "keyring>=23.0.0",
    "lark>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]
docs = [
    "sphinx>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/nakhan98/transmission-qt-remote"
Repository = "https://github.com/nakhan98/transmission-qt-remote"
Issues = "https://github.com/nakhan98/transmission-qt-remote/issues"

[project.scripts]
transmission-qt-remote = "transmission_qt_remote.transmission_client:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "tests"]
pythonVersion = "3.8"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
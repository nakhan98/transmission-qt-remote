name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install uv
        run: pip install uv

      - name: Set up virtual environment
        run: make setup_venv

      - name: Install dependencies
        run: make install

      - name: Run linting
        run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install uv
        run: pip install uv

      - name: Set up virtual environment
        run: make setup_venv

      - name: Install dependencies
        run: |
          make install
          .venv.Linux_x86_64/bin/pip install pyright PySide6-stubs

      - name: Run type checking
        run: make typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libglib2.0-0 \
            libegl1 \
            libgl1 \
            libgles2 \
            libfontconfig1 \
            libfreetype6 \
            libx11-xcb1 \
            libxcb-glx0 \
            xvfb

      - name: Install uv
        run: pip install uv

      - name: Set up virtual environment
        run: make setup_venv

      - name: Install dependencies
        run: |
          make install
          .venv.Linux_x86_64/bin/pip install -r requirements.unit.txt

      - name: Run Unit Tests
        run: make test_unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run Integration Tests in Docker
        run: make docker_test_integration
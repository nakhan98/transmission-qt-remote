[tool:pytest]
# pytest-qt configuration for Qt testing
qt_default_raising = true
qt_log_level_fail = CRITICAL
qt_qapp_name = "Transmission QT Remote"

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Python path configuration
pythonpath = src

# Coverage configuration
addopts =
    --strict-markers
    --strict-config
    --disable-warnings